<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Registration — AquaGuard AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <canvas id="waterAtmosphereCanvas"></canvas>
  <div class="bg-hydro-grid"></div>

  <div class="auth-container">
    <div class="text-center mb-4">
      <div style="width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:24px;color:var(--aqua-1);background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), rgba(16,19,22,.92) 62%, rgba(5,6,7,.98));border:1px solid rgba(255,255,255,.35);box-shadow:0 0 28px rgba(255,255,255,.10), inset 0 0 14px rgba(255,255,255,.06);">
        <i class="bi bi-droplet-half"></i>
      </div>
      <h1 class="h4 text-white fw-bold" style="font-family: 'Space Grotesk';">Analyst Registration</h1>
      <p class="text-secondary small font-mono">Create AquaGuard Command Access</p>
    </div>

    <!-- Flash alerts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show glass-panel mb-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="glass-panel p-4">
      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold font-mono">FULL NAME</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
            <input type="text" name="name" class="form-control holo-input" placeholder="Dr. Jane Doe" value="{{ name or '' }}" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold font-mono">EMAIL ADDRESS</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control holo-input" placeholder="jane.doe@organization.org" value="{{ email or '' }}" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold font-mono">ACCESS KEY (PASSWORD)</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control holo-input" placeholder="Minimum 6 characters" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-secondary small fw-bold font-mono">CONFIRM ACCESS KEY</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-shield-check"></i></span>
            <input type="password" name="confirm_password" class="form-control holo-input" placeholder="Re-enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-holo w-100 py-2 fw-bold">
          <i class="bi bi-person-plus me-2"></i> Register Credentials
        </button>
      </form>
    </div>

    <div class="text-center mt-4 font-mono small">
      <span class="text-secondary">Already authenticated?</span>
      <a href="{{ url_for('auth.login') }}" class="text-info text-decoration-none ms-1 fw-bold">Sign In</a>
      <div class="mt-2">
        <a href="/" class="text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Public Terminal</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
