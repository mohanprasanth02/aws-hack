<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AquaGuard Field — Mobile Companion</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg-dark: #070a0f;
      --card-bg: #0f1523;
      --neon-cyan: #00f2fe;
      --neon-blue: #4facfe;
      --solar-amber: #fbbf24;
      --critical-red: #ff0055;
      --emerald-green: #10b981;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-cyan: rgba(0, 242, 254, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020408;
      color: var(--text-white);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Smartphone Frame */
    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 840px;
      background: var(--bg-dark);
      border-radius: 40px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 242, 254, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island / Notch */
    .notch {
      width: 120px;
      height: 24px;
      background: #000;
      border-radius: 0 0 16px 16px;
      margin: 0 auto;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .notch-camera { width: 8px; height: 8px; border-radius: 50%; background: #111; border: 1px solid #333; }
    .notch-speaker { width: 40px; height: 3px; border-radius: 2px; background: #222; }

    /* Top App Bar */
    .app-header {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      background: rgba(7, 10, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .brand-title { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #fff; }
    .brand-sub { font-size: 10px; color: var(--neon-cyan); font-family: 'JetBrains Mono', monospace; }

    /* Screen Views */
    .screen-view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }
    .screen-view.active { display: flex; }

    /* Scrollbars */
    .screen-view::-webkit-scrollbar { width: 4px; }
    .screen-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* Cyber Cards */
    .cyber-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-light);
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .cyber-card:active { transform: scale(0.99); }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-emergency { background: rgba(255, 0, 85, 0.15); color: var(--critical-red); border: 1px solid rgba(255, 0, 85, 0.4); }
    .badge-high { background: rgba(251, 191, 36, 0.15); color: var(--solar-amber); border: 1px solid rgba(251, 191, 36, 0.4); }
    .badge-resolved { background: rgba(16, 185, 129, 0.15); color: var(--emerald-green); border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-dispatched { background: rgba(0, 242, 254, 0.15); color: var(--neon-cyan); border: 1px solid rgba(0, 242, 254, 0.4); }

    /* Buttons */
    .btn-cyber {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-cyber:active { opacity: 0.85; transform: scale(0.98); }
    .btn-outline-cyber {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Map container */
    #mobileMap {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Bottom Navigation Dock */
    .bottom-nav {
      height: 64px;
      background: rgba(10, 14, 22, 0.95);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      gap: 4px;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--neon-cyan); }
  </style>
</head>
<body>

  <!-- Physical Phone Frame -->
  <div class="phone-container">
    <!-- Notch -->
    <div class="notch">
      <div class="notch-speaker"></div>
      <div class="notch-camera"></div>
    </div>

    <!-- App Header -->
    <header class="app-header">
      <div>
        <div class="brand-title">AQUAGUARD FIELD</div>
        <div class="brand-sub" id="headerWorkerName">Karthik R. (SNS Tech Lead)</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge badge-dispatched" style="font-size: 9px; padding: 2px 6px;">
          <i class="bi bi-broadcast me-1"></i> LIVE
        </span>
        <button onclick="loadWorkerTasks()" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 15px;">
          <i class="bi bi-arrow-repeat"></i>
        </button>
      </div>
    </header>

    <!-- SCREEN 1: TASK FEED (Work Queue) -->
    <div class="screen-view active" id="viewFeed" style="padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-muted);">ACTIVE DISPATCH QUEUE</div>
        <div class="badge badge-high" id="activeTicketsCount">0 Active</div>
      </div>

      <div id="taskListContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
          <div class="spinner-border" style="width: 20px; height: 20px; border-width: 2px; color: var(--neon-cyan); margin-bottom: 8px;"></div>
          <div style="font-size: 12px;">Syncing with central campus core...</div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: GPS ROUTE NAVIGATION -->
    <div class="screen-view" id="viewRoute">
      <!-- Heads-up Distance & ETA Bar -->
      <div style="position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; background: rgba(7,10,15,0.92); backdrop-filter: blur(15px); border-radius: 14px; border: 1px solid var(--border-light); padding: 12px; display: flex; align-items: center; gap: 10px;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(0,242,254,0.15); display: flex; align-items: center; justify-content: center; color: var(--neon-cyan); font-size: 18px;">
          <i class="bi bi-compass-fill"></i>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 12px; font-weight: 700; color: #fff;" id="routeTargetBuilding">Admin Block</div>
          <div style="font-size: 11px; color: var(--solar-amber); font-family: 'JetBrains Mono', monospace;" id="routeDistanceEta">180m away • ~2 min walk</div>
        </div>
        <button onclick="openExternalGoogleMaps()" style="background: none; border: 1px solid var(--border-light); color: var(--neon-cyan); border-radius: 8px; padding: 6px 10px; font-size: 11px; cursor: pointer;">
          <i class="bi bi-box-arrow-up-right me-1"></i>Maps
        </button>
      </div>

      <!-- Leaflet Map Container -->
      <div id="mobileMap"></div>

      <!-- Bottom Action Card -->
      <div style="position: absolute; bottom: 12px; left: 12px; right: 12px; z-index: 1000; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-cyan); padding: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <div style="font-size: 12px; font-weight: 700;" id="routeTaskTitle">Fix Isolation Valve</div>
          <span class="badge badge-emergency" id="routeLeakRate">180 L/h</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn-outline-cyber" style="flex: 1;" onclick="markEnRoute()">
            <i class="bi bi-radar"></i> En Route
          </button>
          <button class="btn-cyber" style="flex: 1;" onclick="openPhotoCaptureForCurrentTask()">
            <i class="bi bi-camera-fill"></i> Upload Proof
          </button>
        </div>
      </div>
    </div>

    <!-- SCREEN 3: PHOTO PROOF UPLOAD -->
    <div class="screen-view" id="viewPhoto" style="padding: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
        <button onclick="switchTab('feed')" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;">
          <i class="bi bi-arrow-left"></i>
        </button>
        <div>
          <div style="font-size: 13px; font-weight: 700; color: #fff;">PROOF OF WORK</div>
          <div style="font-size: 10.5px; color: var(--text-muted);" id="photoTaskTicketId">WO-20260924-101</div>
        </div>
      </div>

      <!-- Camera Preview Box -->
      <div id="photoPreviewContainer" style="width: 100%; height: 220px; background: rgba(0,0,0,0.5); border-radius: 16px; border: 1.5px dashed var(--neon-cyan); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; margin-bottom: 14px;">
        <img id="photoPreviewImg" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
        <div id="photoPlaceholderContent" style="text-align: center;">
          <i class="bi bi-camera-fill" style="font-size: 38px; color: var(--neon-cyan); margin-bottom: 8px; display: inline-block;"></i>
          <div style="font-size: 12px; font-weight: 700;">Take Photo of Repaired Valve</div>
          <div style="font-size: 10.5px; color: var(--text-muted); margin-top: 2px;">Instant visual verification for web admin</div>
        </div>
        <input type="file" id="cameraFileInput" accept="image/*" capture="environment" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer;" onchange="handlePhotoSelected(event)">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 10px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 0.5px; display: block; margin-bottom: 4px;">ROOT CAUSE FOUND</label>
        <textarea id="inputFindings" rows="2" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none;">Cracked valve gasket and loose union ring; persistent 180 L/h water departure.</textarea>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="font-size: 10px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 0.5px; display: block; margin-bottom: 4px;">CORRECTIVE ACTION TAKEN</label>
        <textarea id="inputAction" rows="2" style="width: 100%; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none;">Replaced with industrial EPDM gasket, re-pressurized to 3.2 bar, zero leaks verified.</textarea>
      </div>

      <button class="btn-cyber" style="width: 100%; padding: 14px;" id="btnSubmitProof" onclick="submitPhotoProof()">
        <i class="bi bi-cloud-arrow-up-fill"></i> RESOLVE & SYNC TO WEB APP
      </button>

      <div id="uploadStatusMsg" style="display: none; text-align: center; font-size: 12px; margin-top: 10px; font-weight: 600;"></div>
    </div>

    <!-- Bottom Navigation Dock -->
    <nav class="bottom-nav">
      <div class="nav-item active" id="navFeed" onclick="switchTab('feed')">
        <i class="bi bi-list-task"></i>
        <span>Tasks</span>
      </div>
      <div class="nav-item" id="navRoute" onclick="switchTab('route')">
        <i class="bi bi-geo-alt-fill"></i>
        <span>Route</span>
      </div>
      <div class="nav-item" id="navPhoto" onclick="switchTab('photo')">
        <i class="bi bi-camera-fill"></i>
        <span>Proof</span>
      </div>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let activeTasks = [];
    let currentTask = null;
    let selectedPhotoFile = null;
    let mapInstance = null;
    let workerMarker = null;
    let meterMarker = null;
    let routePolyline = null;

    // Worker starting position (near hostels at SNS campus)
    let workerLat = 11.1002;
    let workerLon = 77.0255;

    document.addEventListener('DOMContentLoaded', () => {
      loadWorkerTasks();
      initMobileMap();
    });

    async function loadWorkerTasks() {
      try {
        const res = await fetch('/api/worker/tasks?email=worker@aquaguard.io&active_only=false');
        const data = await res.json();
        if (data.status === 'success') {
          activeTasks = data.tasks;
          renderTaskList();
        }
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    function renderTaskList() {
      const container = document.getElementById('taskListContainer');
      const openCount = activeTasks.filter(t => t.status !== 'Resolved').length;
      document.getElementById('activeTicketsCount').textContent = `${openCount} Active`;

      if (activeTasks.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">All campus meters nominal. No active dispatches!</div>`;
        return;
      }

      container.innerHTML = activeTasks.map(t => {
        let badgeClass = 'badge-high';
        if (t.priority === 'Emergency') badgeClass = 'badge-emergency';
        if (t.status === 'Resolved') badgeClass = 'badge-resolved';

        return `
          <div class="cyber-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-family: monospace; font-weight: 700; color: #fff; font-size: 12px;">${t.ticket_id}</span>
              <div style="display: flex; gap: 4px;">
                <span class="badge ${badgeClass}">${t.priority}</span>
                <span class="badge ${t.status === 'Resolved' ? 'badge-resolved' : 'badge-dispatched'}">${t.status}</span>
              </div>
            </div>

            <div style="font-weight: 700; font-size: 13.5px; color: #fff; margin-bottom: 4px;">${t.title}</div>
            <div style="font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-bottom: 10px;">
              <i class="bi bi-geo-alt-fill" style="color: var(--neon-cyan);"></i> ${t.location}
            </div>

            <div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 11px;">
              <div>
                <span style="color: var(--text-muted);">Est. Loss: </span>
                <strong style="color: var(--critical-red); font-family: monospace;">${t.estimated_leak_lph} L/h</strong>
              </div>
              <div>
                <span style="color: var(--text-muted);">${t.asset_type}</span>
              </div>
            </div>

            <div style="display: flex; gap: 8px;">
              <button class="btn-outline-cyber" style="flex: 1;" onclick='navigateToTaskRoute(${JSON.stringify(t)})'>
                <i class="bi bi-directions"></i> GPS Route
              </button>
              ${t.status !== 'Resolved' ? `
                <button class="btn-cyber" style="flex: 1;" onclick='openPhotoCaptureForTask(${JSON.stringify(t)})'>
                  <i class="bi bi-camera-fill"></i> Upload Proof
                </button>
              ` : `
                <button class="btn-outline-cyber" style="flex: 1; border-color: var(--emerald-green); color: var(--emerald-green);" disabled>
                  <i class="bi bi-check-circle-fill"></i> Verified
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function initMobileMap() {
      const mapEl = document.getElementById('mobileMap');
      if (!mapEl) return;
      mapInstance = L.map('mobileMap', { zoomControl: false }).setView([11.1018, 77.0275], 17);
      L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0','mt1','mt2','mt3']
      }).addTo(mapInstance);
    }

    function navigateToTaskRoute(task) {
      currentTask = task;
      switchTab('route');

      const meterLat = task.latitude || 11.1018;
      const meterLon = task.longitude || 77.0275;

      document.getElementById('routeTargetBuilding').textContent = task.location;
      document.getElementById('routeTaskTitle').textContent = task.title;
      document.getElementById('routeLeakRate').textContent = `${task.estimatedLeakLph} L/h`;

      if (workerMarker) mapInstance.removeLayer(workerMarker);
      if (meterMarker) mapInstance.removeLayer(meterMarker);
      if (routePolyline) mapInstance.removeLayer(routePolyline);

      // Worker Marker
      workerMarker = L.circleMarker([workerLat, workerLon], {
        radius: 8,
        color: '#00f2fe',
        fillColor: '#00f2fe',
        fillOpacity: 0.9
      }).addTo(mapInstance).bindPopup("<b>Technician Location</b> (You)");

      // Meter Marker
      meterMarker = L.circleMarker([meterLat, meterLon], {
        radius: 10,
        color: '#ff0055',
        fillColor: '#ff0055',
        fillOpacity: 0.9
      }).addTo(mapInstance).bindPopup(`<b>${task.ticket_id}</b><br>${task.location}`);

      // Polyline route
      routePolyline = L.polyline([
        [workerLat, workerLon],
        [(workerLat + meterLat)/2, workerLon],
        [meterLat, meterLon]
      ], {
        color: '#00f2fe',
        weight: 4,
        dashArray: '6, 6'
      }).addTo(mapInstance);

      mapInstance.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
    }

    function openExternalGoogleMaps() {
      if (!currentTask) return;
      const lat = currentTask.latitude || 11.1018;
      const lon = currentTask.longitude || 77.0275;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`, '_blank');
    }

    async function markEnRoute() {
      if (!currentTask) return;
      await fetch(`/api/worker/tasks/${currentTask.id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'En Route' })
      });
      alert('Status marked: EN ROUTE. Central web dashboard notified!');
      loadWorkerTasks();
    }

    function openPhotoCaptureForTask(task) {
      currentTask = task;
      document.getElementById('photoTaskTicketId').textContent = `${task.ticket_id} • ${task.location}`;
      switchTab('photo');
    }

    function openPhotoCaptureForCurrentTask() {
      if (!currentTask && activeTasks.length > 0) currentTask = activeTasks[0];
      if (currentTask) openPhotoCaptureForTask(currentTask);
    }

    function handlePhotoSelected(event) {
      const file = event.target.files[0];
      if (file) {
        selectedPhotoFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('photoPreviewImg');
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById('photoPlaceholderContent').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }

    async function submitPhotoProof() {
      if (!currentTask) {
        alert('Please select an active work order first.');
        return;
      }

      const btn = document.getElementById('btnSubmitProof');
      const statusMsg = document.getElementById('uploadStatusMsg');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> SYNCING PHOTO TO WEB APPLICATION...`;

      const formData = new FormData();
      formData.append('findings', document.getElementById('inputFindings').value);
      formData.append('action_taken', document.getElementById('inputAction').value);
      formData.append('notes', 'Field technician photo verification attached.');

      if (selectedPhotoFile) {
        formData.append('photo', selectedPhotoFile);
      }

      try {
        const res = await fetch(`/api/worker/tasks/${currentTask.id}/complete`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.status === 'success') {
          statusMsg.style.display = 'block';
          statusMsg.style.color = 'var(--emerald-green)';
          statusMsg.textContent = `✓ Work order ${currentTask.ticket_id} resolved! Water saved: ${data.work_order.water_saved_liters.toLocaleString()} L. Synchronized with Web App!`;
          btn.innerHTML = `✓ SYNC COMPLETED`;
          setTimeout(() => {
            loadWorkerTasks();
            switchTab('feed');
          }, 2000);
        } else {
          statusMsg.style.display = 'block';
          statusMsg.style.color = 'var(--critical-red)';
          statusMsg.textContent = 'Upload failed: ' + data.message;
          btn.disabled = false;
          btn.innerHTML = `TRY AGAIN`;
        }
      } catch (err) {
        statusMsg.style.display = 'block';
        statusMsg.style.color = 'var(--critical-red)';
        statusMsg.textContent = 'Connection error: ' + err.message;
        btn.disabled = false;
        btn.innerHTML = `TRY AGAIN`;
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.screen-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (tab === 'feed') {
        document.getElementById('viewFeed').classList.add('active');
        document.getElementById('navFeed').classList.add('active');
      } else if (tab === 'route') {
        document.getElementById('viewRoute').classList.add('active');
        document.getElementById('navRoute').classList.add('active');
        if (mapInstance) {
          setTimeout(() => { mapInstance.invalidateSize(); }, 200);
        }
      } else if (tab === 'photo') {
        document.getElementById('viewPhoto').classList.add('active');
        document.getElementById('navPhoto').classList.add('active');
      }
    }
  </script>
</body>
</html>
