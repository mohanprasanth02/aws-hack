name: aquaguard_field
description: "AquaGuard AI Field Worker Companion — Real-time risk dispatch, GPS campus navigation, and proof-of-work photo sync."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.0.7
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^13.0.1
  url_launcher: ^6.2.5
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1
  cupertino_icons: ^1.0.6

dependency_overrides:
  geolocator_android: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
